[pytest]
# Three-tier marker scheme (PLAN_power_service.md M0):
#   unit — fast, no simulator backend needed. Default selection.
#   sim  — needs a built simulator backend under backends/ (run at milestone DoD).
#   hw   — needs real GPU/NPU hardware; never run in CI.
# Unmarked tests are auto-marked `unit` by the root conftest.py, so the
# pre-existing planner/ and tests/ suites keep running under the default.
markers =
    unit: fast tests, no simulator backend required (default selection)
    sim: requires a built simulator backend under backends/
    hw: requires real hardware (GPU/NPU); excluded from CI
    docker: requires a local docker daemon (CI-optional)
addopts = -m unit
# Bare `pytest` collects only our suites — never the backends/ submodules
# (their own test trees are not runnable from this repo).
testpaths =
    tests
    planner/tests
    service/tests
    sim_backends/measured/tests
norecursedirs = backends output .omc profiles cluster_config dataset docs
