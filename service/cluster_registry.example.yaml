# Cluster registry — single source of truth for the serving-recommendation
# service (R1). Copy to <repo>/cluster_registry.yaml (or point
# LLMSS_CLUSTER_REGISTRY at it) and edit to match your hardware; the webapp
# mounts the service API only when the file exists.
#
# Devices get stable identities <node>/<hw>/<index> in the reservation ledger.
# host_base_w is counted once per powered host in power-min planning.

nodes:
  - id: node0
    host_base_w: 250
    devices:
      - {name: A40, count: 8, mem_gb: 48}
  - id: node1
    host_base_w: 200
    devices:
      - {name: A5000, count: 2, mem_gb: 24}
links:
  - {src: node0, dst: node1, bandwidth: "100Gbps", latency: "0.001ms"}
intra_node_bandwidth: "600GBps"
